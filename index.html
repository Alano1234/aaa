<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>无限流副本｜午夜酒店</title>
<style>
:root{--bg:#0f1016;--panel:#181a24;--panel2:#202334;--line:#32364a;--text:#f0f1f6;--muted:#9ba1b4;--accent:#b9a7ff;--good:#92e1bd;--warn:#ffd38a;--danger:#ff8495}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 25% 10%,#1c1d2a,#0f1016 50%,#090a0e);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:16px}header,.panel{background:rgba(24,26,36,.96);border:1px solid var(--line);border-radius:14px}header{padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.title{font-weight:800;font-size:20px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:12px;background:#11131a;border:1px solid var(--line);padding:7px 10px;border-radius:999px}.pill b{color:var(--accent)}.grid{display:grid;grid-template-columns:210px 1fr 260px;gap:14px}.panel{overflow:hidden}.panel h3{margin:0;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px}.content{padding:12px 13px}.room{background:#12141b;border:1px solid transparent;border-radius:10px;padding:10px;margin-bottom:7px;cursor:pointer}.room:hover{border-color:#545a78}.room.active{background:#25283a;border-color:var(--accent)}.room .n{font-size:13px;font-weight:700}.room .d{font-size:10px;color:var(--muted);margin-top:3px}.scene{padding:17px}.top{display:flex;justify-content:space-between;gap:10px}.loc{font-size:22px;font-weight:800}.clock{font-size:12px;color:var(--warn)}.desc{font-size:13px;line-height:1.75;color:#c9cdda;margin:10px 0 12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:#12141b;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;min-height:78px}.card:hover{background:#151925;border-color:#555b78}.card .big{font-size:18px}.card .name{font-size:12px;font-weight:700;margin-top:5px}.card .tiny{font-size:10px;color:var(--muted);margin-top:3px}.section-title{font-size:12px;font-weight:700;margin:12px 0 7px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #4a4f66;background:#24283a;color:var(--text);padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12px}button:hover{background:#2e3248}button.primary{background:#3c3362;border-color:#6a59a7}button.danger{background:#2d1820;border-color:#693947}.log{height:250px;overflow:auto;background:#101118;border-top:1px solid var(--line);padding:9px 11px;font-size:11px;line-height:1.55}.log p{margin:0 0 8px}.me{color:#ddd5ff}.npc{color:#b6dff0}.sys{color:#ffd79e}.meter{margin-bottom:11px}.meterTop{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.bar{height:7px;background:#0e1016;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:4px}.fill{height:100%;width:0;background:var(--accent)}.hint{font-size:10px;line-height:1.6;color:#c7cad6;padding:9px;border:1px dashed #4c5064;border-radius:10px}.list{font-size:11px;line-height:1.75;color:#c8cad4}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{max-width:560px;width:100%;background:#181a24;border:1px solid #4c526a;border-radius:15px;box-shadow:0 20px 70px rgba(0,0,0,.5)}.modalhead{padding:13px 15px;border-bottom:1px solid var(--line);font-weight:800}.modalbody{padding:15px;font-size:13px;line-height:1.8;color:#d6d9e2}.choices{display:grid;gap:7px;margin-top:12px}.ending{font-size:21px;font-weight:800;margin-bottom:7px}.score{color:var(--good)}
@media(max-width:980px){.grid{grid-template-columns:180px 1fr}.right{grid-column:1/-1}}@media(max-width:680px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.scene{padding:13px}.log{height:210px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><div class="title">∞ 无限流副本：午夜酒店</div><div class="sub">最小玩法测试版 · 单人模拟多人 · 探索 → 发现 → 选择 → 后果</div></div><div class="stats"><div class="pill">时间 <b id="time">00:00</b></div><div class="pill">理智 <b id="sanity">100</b></div><div class="pill">线索 <b id="clues">0</b></div><div class="pill">积分 <b id="score">0</b></div></div></header>
<div class="grid">
<aside class="panel"><h3>地点</h3><div class="content" id="rooms"></div></aside>
<main class="panel scene"><div class="top"><div><div class="loc" id="loc"></div><div class="sub">点击左侧地点移动</div></div><div class="clock" id="clockHint"></div></div><div class="desc" id="desc"></div>
<div class="section-title">附近可以调查</div><div class="cards" id="objects"></div>
<div class="section-title">附近的人</div><div class="cards" id="people"></div>
<div class="actions"><button onclick="advance(1)">等 1 分钟</button><button onclick="advance(3)">等 3 分钟</button><button class="primary" onclick="observe()">观察周围</button><button class="danger" onclick="leaveRun()">尝试离开</button></div>
<div class="section-title">动态记录</div><div class="log" id="log"></div></main>
<aside class="panel right"><h3>本局状态</h3><div class="content"><div class="meter"><div class="meterTop"><span>探索度</span><span id="exploreVal">0%</span></div><div class="bar"><div class="fill" id="exploreBar"></div></div></div><div class="meter"><div class="meterTop"><span>异常压力</span><span id="pressureVal">0%</span></div><div class="bar"><div class="fill" id="pressureBar"></div></div></div><div class="hint"><b>不用等所有人。</b><br>你可以自己去别的房间；人物会自己移动。只有关键节点才会弹出选择。</div><div style="height:12px"></div><div class="section-title">当前目标</div><div class="list" id="objective"></div><div class="section-title">随行参与者（模拟）</div><div class="list"><div>• 林娜：谨慎，爱调查</div><div>• 阿哲：爱冒险，容易乱来</div><div>• 乔：沉默，似乎知道什么</div></div><div style="height:10px"></div><button style="width:100%" onclick="resetRun()">重新开始</button></div></aside>
</div></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead" id="modalTitle"></div><div class="modalbody" id="modalBody"></div></div></div>
<script>
const rooms={
 lobby:{name:'一楼大厅',desc:'昏黄的灯把大理石地面照得像刚下过雨。前台没人，墙上的电子钟比你的手机慢了两分钟。',objects:[['📒','登记簿','调查住客记录','registry'],['🔑','钥匙柜','查看房卡','keys'],['🖥️','前台电脑','看看屏幕','computer'],['🕰️','电子钟','确认时间','clock']],people:['nina','azhe','qiao']},
 restaurant:{name:'餐厅',desc:'自助餐还在冒热气，却没有任何厨师。角落里一台旧电视正在播放昨晚的新闻。',objects:[['📺','旧电视','看看正在播什么','tv'],['🍽️','自助餐台','检查食物','food'],['🧾','小票','桌下有一张皱掉的小票','receipt']],people:['nina','azhe']},
 third:{name:'三楼走廊',desc:'灯光比大厅暗。两侧全是房门，但门牌号从 301 跳到了 307。',objects:[['🚪','307 房','门没有上锁','307'],['🖼️','走廊画像','画像里的电梯门似乎在变化','portrait'],['🧹','清洁车','车上有一把旧钥匙','cart']],people:['qiao']},
 fourth:{name:'四楼走廊',desc:'这里安静得不自然。地毯上有一小片水迹，一直通向墙边，然后消失。',objects:[['🚪','417 房','门牌边缘有新鲜刮痕','417'],['📷','监控屏','四楼监控画面','camera'],['💧','水迹','顺着水迹调查','water']],people:['nina']},
 basement:{name:'地下层',desc:'空气很冷。这里没有客房，只有储物间、锅炉房和一部不该还在运行的旧电梯。',objects:[['🛗','旧电梯','按钮只写着“0”','elevator'],['📦','储物箱','里面有些奇怪物品','box'],['🪞','镜子','镜中的你慢半拍','mirror']],people:['azhe']}
};
const npcs={nina:{name:'林娜',icon:'🧍‍♀️',desc:'一直在记笔记。'},azhe:{name:'阿哲',icon:'🧍',desc:'对危险有种奇怪的兴趣。'},qiao:{name:'乔',icon:'🧍‍♂️',desc:'安静得像在等什么。'}};
const data={
 registry:['登记簿','你翻到最后一页。417 房的住客写着：乔。可是乔明明告诉你，他住的是 307。',true],
 keys:['钥匙柜','407、417、427……数字并不按顺序排列。最下面有一把没有号码的钥匙。',true],
 computer:['前台电脑','入住系统显示：今天是 10 月 8 日。退房系统却显示：今天是 10 月 7 日。',true],
 clock:['电子钟','酒店的钟比手机慢两分钟。你盯着它时，它突然快进了 17 秒。',true],
 tv:['旧电视','新闻正在播报“昨晚的酒店失踪案”。画面角落写着：3 年前。',true],
 food:['自助餐台','标签写着“为 8 位住客准备”。你数了数，现在只有 4 个住客。',false],
 receipt:['皱掉的小票','金额：40.17。时间：03:17。购买者：你。但你还没有来过餐厅。',true],
 '307':['307 房','房间很普通。床头柜上有一张照片：你、林娜、阿哲、乔。背面日期：三年前。',true],
 portrait:['走廊画像','画像里的电梯门从“4”变成“0”，又恢复成“4”。你眨了一次眼。',true],
 cart:['清洁车','旧钥匙上没有房号，只有一颗刻着“三”的铜星。',true],
 '417':['417 房','门牌下面有一块被拆过的螺丝痕迹。里面传来敲击声：三下，停顿，再三下。',true],
 camera:['监控屏','画面里能看到你自己站在四楼走廊。但现在你明明还在看屏幕。',true],
 water:['水迹','水迹一路延伸到墙角。你摸到一张湿掉的房卡：0。',true],
 elevator:['旧电梯','按钮只有 0。按下后，电梯门没关，却传来楼上传来的脚步声。',true],
 box:['储物箱','里面是一堆已经被拆开的酒店钥匙，所有号码都被刮掉了。',false],
 mirror:['镜子','你抬手。镜子里的你晚了半拍才抬手。',true]
};
let s;
function fresh(){return{room:'lobby',m:0,sanity:100,clues:0,score:0,explore:0,pressure:0,seen:{},rule:false,rule2:false,power:false,ended:false,npc:{nina:'lobby',azhe:'restaurant',qiao:'third'}}}
s=fresh();
const $=id=>document.getElementById(id);
function log(t,c='sys'){let p=document.createElement('p');p.className=c;p.textContent=t;$('log').prepend(p)}
function render(){
 $('time').textContent=String(Math.floor(s.m/60)).padStart(2,'0')+':'+String(s.m%60).padStart(2,'0');$('sanity').textContent=s.sanity;$('clues').textContent=s.clues;$('score').textContent=s.score;
 $('exploreVal').textContent=Math.min(100,s.explore)+'%';$('exploreBar').style.width=Math.min(100,s.explore)+'%';$('pressureVal').textContent=Math.min(100,s.pressure)+'%';$('pressureBar').style.width=Math.min(100,s.pressure)+'%';
 $('loc').textContent=rooms[s.room].name;$('desc').textContent=rooms[s.room].desc;$('clockHint').textContent=s.rule?(s.rule2?'规则正在变化':'已发现规则'):'规则尚未发现';
 $('rooms').innerHTML='';for(const [k,r] of Object.entries(rooms)){let d=document.createElement('div');d.className='room '+(k===s.room?'active':'');d.innerHTML='<div class="n">'+r.name+'</div><div class="d">'+(k==='basement'?'危险区域':k==='lobby'?'安全起点':'可探索')+'</div>';d.onclick=()=>move(k);$('rooms').appendChild(d)}
 $('objects').innerHTML='';rooms[s.room].objects.forEach(o=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div class="big">'+o[0]+'</div><div class="name">'+o[1]+'</div><div class="tiny">'+o[2]+'</div>';d.onclick=()=>inspect(o[3]);$('objects').appendChild(d)});
 $('people').innerHTML='';rooms[s.room].people.forEach(id=>{let n=npcs[id],here=s.npc[id]===s.room;let d=document.createElement('div');d.className='card';d.innerHTML='<div class="big">'+n.icon+'</div><div class="name">'+n.name+(here?' · 在这里':' · 路过')+'</div><div class="tiny">'+n.desc+'</div>';d.onclick=()=>talk(id);$('people').appendChild(d)});
 $('objective').textContent=!s.rule?'找到第一条酒店规则。':!s.rule2?'弄清楚为什么 3:00 后会出现“无门牌房间”。':'活到 5:00，或者主动找到酒店的真相。';
}
function move(k){if(s.ended)return;s.room=k;s.m++;s.explore=Math.min(100,s.explore+4);if(k==='basement'){s.pressure=Math.min(100,s.pressure+6);s.sanity=Math.max(0,s.sanity-2)}log('你来到了「'+rooms[k].name+'」。','me');timed();render()}
function advance(n){if(s.ended)return;s.m+=n;let seq=[['nina','lobby'],['nina','fourth'],['azhe','restaurant'],['azhe','basement'],['qiao','third'],['qiao','lobby']];let [id,r]=seq[Math.floor(s.m/2)%seq.length];s.npc[id]=r;if(s.m>=180&&!s.power){s.power=true;s.pressure+=15;log('整栋酒店的灯同时熄灭了一秒。恢复后，电梯按钮多出了一枚「0」。');event('停电后的广播','黑暗只持续了一秒，但你听见电梯里有人敲了三下。随后广播响起：<br><br>“凌晨三点以后，请勿打开没有门牌号的房间。”',[['记住这条规则',close]]);}if(s.m>=210&&s.rule&&!s.rule2){s.rule2=true;s.pressure+=10;log('你意识到：广播只说“没有门牌号”，没有说“没有房间号”。');}timed();render()}
function timed(){if(s.m>=240&&!s.ended){if(s.clues>=3){event('5:00','酒店的钟终于跳到 05:00。所有房门同时开了一条缝。<br><br>乔站在走廊尽头：“现在你可以问我，为什么我知道这家酒店不存在。”',[['直接追问真相',()=>finish('真相路线',120)],['叫上所有人一起问',()=>finish('团队路线',100)],['什么也不问，先离开',()=>finish('谨慎路线',80)]]);return}else finish('普通生还',55)}}
function inspect(k){if(s.ended)return;if(s.seen[k]){log('这里你已经仔细看过了。','me');return}let d=data[k];s.seen[k]=1;s.explore=Math.min(100,s.explore+8);s.score+=5;if(d[2]){s.clues++;s.score+=10}log(d[0]+'：'+d[1],'me');event(d[0],d[1]);if(s.clues>=3&&!s.rule){s.rule=true;s.score+=35;log('你把几条线索拼起来，终于发现：这里有一条真正的酒店规则。')}render()}
function talk(id){if(s.ended)return;if(id==='nina')event('和林娜说话',s.rule?'林娜压低声音：“我查过登记簿了。那把无号码钥匙，不要给乔。”':'林娜：“你也觉得这酒店怪怪的？先看看登记簿。”',[['告诉她你发现的线索',()=>{s.score+=12;log('你把部分线索告诉了林娜。','npc');close();render()}],['暂时隐瞒',()=>{s.score+=6;log('你没有把全部发现告诉她。','me');close();render()}]]);else if(id==='azhe')event('和阿哲说话','阿哲笑着说：“地下室有东西。要不要一起去？如果你胆小，我就自己去。”',[['跟他去地下室',()=>{close();move('basement')}],['让他自己去',()=>{close();advance(2)}]]);else event('和乔说话',s.rule2?'乔：“如果你已经发现第二条规则，那就说明它开始相信你了。”':'乔：“别开没有门牌的门。不是因为里面有怪物。”',[['问“那里面是什么？”',()=>{s.clues++;s.score+=15;log('乔没有回答，只说：“你还没准备好。”','npc');close();render()}],['转身离开',()=>{s.score+=3;close();render()}]])}
function observe(){if(s.ended)return;s.m++;s.pressure=Math.min(100,s.pressure+2);let a=['你听见远处有电梯到站的声音，但这里明明没人按电梯。','有人从你身边经过。你回头时，走廊空无一人。','前台电话响了一声。没人接。','墙上的应急灯闪了一次，显示出了一个你没见过的楼层。'];log(a[Math.floor(Math.random()*a.length)]);timed();render()}
function event(t,b,choices=[['继续',close]]){$('modalTitle').textContent=t;$('modalBody').innerHTML='<div>'+b+'</div>';let c=document.createElement('div');c.className='choices';choices.forEach(x=>{let btn=document.createElement('button');btn.textContent=x[0];btn.onclick=x[1];c.appendChild(btn)});$('modalBody').appendChild(c);$('modal').classList.add('show')}
function close(){$('modal').classList.remove('show')}
function finish(label,base){if(s.ended)return;s.ended=true;close();let final=Math.max(0,base+s.score+s.clues*5+Math.floor(s.explore/10)*4-Math.floor(s.pressure/20)*3);event('副本结算','<div class="ending">'+label+'</div><div class="score">最终积分：'+final+'</div><br>发现线索：'+s.clues+'<br>探索度：'+Math.min(100,s.explore)+'%<br>异常压力：'+s.pressure+'%<br><br><span style="color:#aeb4c6">测试重点：这个版本先验证“自由走动 + 调查 + NPC自己行动 + 关键选择 + 结局”。</span>',[['回到大厅（重开）',()=>{s=fresh();$('log').innerHTML='';log('你重新进入了酒店。先别急着找真相，先看看这个地方。');close();render()}],['结束本局',close]])}
function leaveRun(){finish('你提前离开了酒店',35)}
function resetRun(){s=fresh();$('log').innerHTML='';log('欢迎来到《午夜酒店》。先别急着找真相，先看看这个地方。');render()}
resetRun();
</script></body></html>
