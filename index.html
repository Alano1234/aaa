<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无限流副本：午夜酒店</title><style>
*{box-sizing:border-box}body{margin:0;background:#100d15;color:#eee7f1;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.wrap{max-width:1250px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end}.eyebrow{color:#f5a7c8;letter-spacing:2px;font-size:11px}.title{font-size:28px;font-weight:800}.sub{color:#9e94a6;margin-top:5px}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:end}.chip{padding:7px 10px;border:1px solid #382f40;border-radius:99px;background:#18141d;color:#aaa0ae;font-size:12px}.chip b{color:#fff}.layout{display:grid;grid-template-columns:190px 1fr 260px;gap:10px;margin-top:12px}.panel{background:#18141d;border:1px solid #352d3b;border-radius:13px;overflow:hidden}.panel h3{font-size:13px;color:#ffd7e7;margin:0;padding:12px;border-bottom:1px solid #352d3b}.places{padding:7px}.place,.action,.choice{width:100%;border:1px solid transparent;background:transparent;color:#b8aebd;border-radius:9px;padding:10px;text-align:left;cursor:pointer}.place:hover,.place.on{background:#251d29;color:#ffd7e7;border-color:#4d3b4d}.place small{display:block;color:#77707c;margin-top:3px}.main{min-height:680px;display:flex;flex-direction:column}.head{padding:16px;border-bottom:1px solid #352d3b}.head h2{margin:5px 0;font-size:23px}.desc{color:#a8a0ab;line-height:1.5}.body{display:grid;grid-template-columns:1fr 270px;gap:10px;padding:12px;flex:1}.story{background:#120f16;border:1px solid #2c2630;border-radius:11px;padding:14px;line-height:1.8;min-height:370px}.story .p{margin:9px 0}.pink{color:#ffd0e2}.warn{color:#f0a3ad}.good{color:#a9d7b8}.muted{color:#837987}.actions{display:grid;gap:7px;margin-top:9px}.action{background:#211b25;border-color:#39303d;color:#eee}.action:hover{background:#2b222e;border-color:#5b4656}.action small{display:block;color:#8f8492;margin-top:3px}.char{display:grid;grid-template-columns:60px 1fr;gap:9px;padding:9px;border:1px solid #2d2631;border-radius:10px;background:#131017;margin:8px}.av{width:60px;height:72px;border-radius:10px;display:grid;place-items:center;font-size:28px;background:linear-gradient(150deg,#3e3145,#211923)}.rabbit{background:linear-gradient(150deg,#f5b6d4,#5a3c50)}.nina{background:linear-gradient(150deg,#3e4655,#20242a)}.char b{font-size:13px}.char small{display:block;color:#958a99;line-height:1.45;margin-top:3px}.sidebox{padding:11px}.kv{display:flex;justify-content:space-between;color:#958a99;margin:8px 0}.kv b{color:#fff}.bar{height:7px;background:#28222d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#f5a7c8;width:30%}.goal{padding:10px;border:1px solid #4a3847;background:#211923;border-radius:10px;color:#c9c0ca;line-height:1.55}.goal b{color:#ffd2e4}.log{max-height:230px;overflow:auto;padding:0 11px 11px}.log div{padding:7px 0;border-bottom:1px solid #28222b;color:#8f8591;font-size:11px;line-height:1.45}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px}.modal{max-width:690px;width:100%;background:#19151e;border:1px solid #574351;border-radius:15px;padding:22px;box-shadow:0 25px 90px #000}.modal h2{margin:5px 0 10px}.modal p{color:#c9c0cb;line-height:1.75}.quote{padding:11px 13px;border-left:3px solid #f5a7c8;background:#241b26;color:#ffd6e6;border-radius:4px}.choices{display:grid;gap:7px;margin-top:13px}.choice{background:#251e29;border-color:#443540;color:#fff}.choice:hover{background:#302431}.hide{display:none!important}@media(max-width:980px){.layout{grid-template-columns:1fr}.body{grid-template-columns:1fr}.stats{justify-content:start}.top{display:block}.main{min-height:0}}
</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">INFINITE INSTANCE / TEST BUILD</div><div class="title">午夜酒店：第一夜</div><div class="sub">进入副本，理解规则，做出选择，活着回来。</div></div><div class="stats"><div class="chip">时间 <b id=t>23:40</b></div><div class="chip">理智 <b id=s>100</b></div><div class="chip">线索 <b id=c>0</b></div><div class="chip">积分 <b id=p>1200</b></div><div class="chip">异常压力 <b id=x>0</b></div></div></div><div class="layout"><div class="panel"><h3>地点</h3><div id=places></div></div><div class="panel main"><div class=head><div class=eyebrow id=ey>地点 / 大厅</div><h2 id=ttl>酒店大厅</h2><div class=desc id=desc>大理石地面亮得反常。前台没人，电子钟停在23:40。</div></div><div class=body><div><div class=story id=story></div><div class=actions id=actions></div></div><div class="panel"><h3>附近的人</h3><div id=chars></div><h3>当前目标</h3><div class=sidebox><div class=goal id=goal></div></div></div></div></div><div class="panel"><h3>副本状态</h3><div class=sidebox><div class=kv><span>探索度</span><b id=e>0%</b></div><div class=bar><i id=eb></i></div><div class=kv><span>规则</span><b id=r>未知</b></div><div class=kv><span>绒团团</span><b id=rm>未知</b></div></div><h3>动态记录</h3><div class=log id=log></div></div></div></div><div class="modalback" id=modal><div class=modal><div class=eyebrow>副本载入</div><h2 id=mt>你为什么会来到这里？</h2><p id=mp></p><div class=quote id=mq></div><div class=choices id=mc></div></div></div><script>
const P={大厅:['前台 / 电梯 / 自动贩卖机','大理石地面亮得反常。前台没人，电子钟停在23:40。'],餐厅:['自助餐 / 窗边座位','甜点还温着。这里没有工作人员。'],三楼:['307 / 309 / 镜子','走廊很安静，尽头的镜子比空气还暗。'],四楼:['417 / 消防门','这一层安静得过分。'],地下层:['监控室 / 储物箱 / 无编号房门','空气变冷了，墙上的水迹像有人刚刚爬出来。']};
const A={大厅:[['调查登记簿','找到今晚住客记录',register],['看电子钟','它好像跳过时间',clock],['查钥匙柜','417的钥匙不见了',keys],['靠近自动贩卖机','那里蹲着一只白兔子',rabbit],['去餐厅','自由移动',()=>move('餐厅')],['去三楼','自由移动',()=>move('三楼')],['去四楼','自由移动',()=>move('四楼')],['去地下层','自由移动',()=>move('地下层')]],餐厅:[['查草莓蛋糕','盘底有一张收据',cake],['看窗边','椅背上有水迹',water],['和林娜聊聊','她似乎知道那封邮件',nina],['和阿哲聊聊','他手里拿着417房卡',zhe],['回大厅','',()=>move('大厅')]],三楼:[['调查307','房间里有第二部手机',r307],['看镜子','镜像慢了一拍',mirror],['去四楼','',()=>move('四楼')],['回大厅','',()=>move('大厅')]],四楼:[['调查417','门后的声音提到了兔子',r417],['看消防门','门后像是另一条路',fire],['去地下层','电梯自己开了',()=>move('地下层')],['回三楼','',()=>move('三楼')]],地下层:[['看旧监控','未来的画面已经存在',cctv],['查储物箱','箱子上写着你的名字',locker],['靠近无编号房门','门缝下有光',door],['回大厅','',()=>move('大厅')]]};
const st={place:'大厅',time:1420,sanity:100,clues:0,points:1200,pressure:0,exp:0,flags:new Set(),logs:[],rabbit:'未知'};
const $=id=>document.getElementById(id); const log=x=>{st.logs.unshift(x);$('log').innerHTML=st.logs.slice(0,25).map(v=>'<div>'+v+'</div>').join('')}; const tick=n=>{st.time+=n;st.pressure=Math.min(100,st.pressure+Math.floor(n/3));render()}; const fmt=m=>{m%=1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function render(){ $('t').textContent=fmt(st.time);$('s').textContent=st.sanity;$('c').textContent=st.clues;$('p').textContent=st.points;$('x').textContent=st.pressure;$('e').textContent=Math.min(100,st.exp*6)+'%';$('eb').style.width=Math.min(100,st.exp*6)+'%';$('r').textContent=st.flags.has('rule')?'已确认':'未知';$('rm').textContent=st.rabbit; $('ey').textContent='地点 / '+st.place;$('ttl').textContent=st.place==='三楼'?'三楼走廊':st.place==='四楼'?'四楼走廊':st.place; $('desc').textContent=P[st.place][1];$('places').innerHTML=Object.keys(P).map(k=>`<button class="place ${k===st.place?'on':''}" onclick="move('${k}')">${k}<small>${P[k][0]}</small></button>`).join('');$('actions').innerHTML=A[st.place].map((a,i)=>`<button class="action" onclick="go(${i})">${a[0]}<small>${a[1]}</small></button>`).join('');$('goal').innerHTML=st.clues<2?'<b>先弄清楚你为什么来。</b><br>探索酒店，认识至少一名住客。':!st.flags.has('rule')?'<b>找到酒店的规则。</b><br>不要急着下结论。':'<b>活到05:00。</b><br>异常正在逐渐失控。';$('chars').innerHTML=chars().map(c=>`<div class=char><div class="av ${c[1]}">${c[2]}</div><div><b>${c[0]}</b><small>${c[3]}</small></div></div>`).join('')}
function chars(){if(st.place==='地下层')return [['绒团团','rabbit','🐇',st.rabbit]];if(st.place==='餐厅')return [['林娜','nina','◐','抱着笔记本。'],['阿哲','','◇','一直看手机。']];if(st.place==='四楼'||st.place==='三楼')return [['乔','','◌','笑得很自然。']];return [['林娜','nina','◐','观察别人。'],['阿哲','','◇','很紧张。'],['乔','','◌','看起来没什么事。'],['绒团团','rabbit','🐇',st.rabbit]]}
function move(p){st.place=p;tick(3);st.exp++;log('<b>移动：</b>你前往了'+p+'。')};function go(i){tick(4);st.exp++;A[st.place][i][2]()}
function write(h){$('story').innerHTML=h}
function register(){if(!st.flags.has('reg')){st.flags.add('reg');st.clues++;st.exp++;log('<b>线索：</b>今晚只有林娜、阿哲、乔和你。乔说自己住307，但登记簿写着417。')}write(`<div class=p>登记簿很干净。</div><div class=p>今晚入住的人只有四个：<span class=pink>林娜——309 / 阿哲——311 / 乔——417 / 你——307</span></div><div class=warn>乔刚才明明告诉你：他住307。</div>`)}
function clock(){st.pressure+=8;st.clues++;write('<div class=p>电子钟显示 <b>23:40</b>。</div><div class=p>你眨了一下眼。</div><div class=warn>03:17。</div><div class=p>再眨一次，又变回23:40。</div>');log('<b>异常：</b>电子钟短暂显示03:17。')}
function keys(){st.clues++;write('<div class=p>钥匙柜里只有417的位置是空的。</div><div class=p>柜门边还粘着几根<span class=pink>粉色毛屑</span>。</div>');log('<b>线索：</b>417钥匙失踪，附近有粉色毛屑。')}
function rabbit(){if(st.flags.has('rab'))return write('<div class=p><b class=pink>绒团团：</b>“你又来啦。”</div><div class=p>它把草莓糖藏进怀里。</div>');st.flags.add('rab');st.rabbit='对你有兴趣';log('<b>绒团团：</b>“你也进来了？”');write('<div class=p>自动贩卖机旁蹲着一只漂亮得过分的白兔子。</div><div class=p><b class=pink>绒团团：</b>“你也进来了？”</div><div class=p>“也？”</div><div class=pink>“没什么呀。”</div><div class=p>它盯着粉色包装的糖。</div><div class=pink>“要买幸运糖吗？很好吃。”</div>');choice('绒团团的小生意','它卖得很认真，但不知道为什么让你觉得不太靠谱。',[['花100积分买糖',buy],['问“你到底是什么？”',ask],['拒绝',()=>{st.rabbit='有点不爽';write('<div class=pink>绒团团：“哦。”</div><div class=p>它转身继续吃自己的糖。</div>')}]]);}
function buy(){if(st.points<100)return write('<div class=warn>绒团团：“没钱还想买？好可怜。”</div>');st.points-=100;st.rabbit='赚到钱了，心情很好';write('<div class=p>你付100积分。</div><div class=pink>绒团团：“成交！”</div><div class=p>它递给你一颗糖，然后补充：</div><div class=pink>“连续吃十颗才有效哦。”</div><div class=warn>你现在确信自己被坑了。</div>');log('<b>消费：</b>你花100积分从绒团团那里买了一颗“幸运糖”。')}
function ask(){st.rabbit='眯着眼看你';write('<div class=p>“你到底是什么？”</div><div class=pink>绒团团：“我是绒团团呀。”</div><div class=p>“我不是问名字。”</div><div class=pink>“可是我也不知道你在问什么。”</div>');log('<b>绒团团：</b>它拒绝解释自己的身份。')}
function cake(){st.clues++;write('<div class=p>草莓蛋糕还是温的。</div><div class=pink>收据：417 / 草莓蛋糕 / 03:17</div><div class=warn>现在甚至还没到午夜。</div>');log('<b>线索：</b>417在03:17点过草莓蛋糕。')}
function water(){st.clues++;write('<div class=p>水迹从椅背一路延伸到窗边。</div><div class=p>窗户是锁着的。</div><div class=warn>水不是从外面来的。</div>');log('<b>线索：</b>餐厅水迹来自室内。')}
function nina(){st.flags.add('people');st.clues++;write('<div class=pink><b>林娜：</b>“你也是收到那封邮件的人？”</div><div class=p>她没有问“哪封”。</div><div class=pink>“别去四楼，尤其是417。”</div>');log('<b>林娜：</b>她知道那封邮件。')}
function zhe(){st.flags.add('people');st.clues++;write('<div class=pink><b>阿哲：</b>“我只是路过。”</div><div class=p>你看了一眼他的房卡：<b>417</b>。</div><div class=warn>“……别告诉别人。”</div>');log('<b>阿哲：</b>他说自己只是路过，却拿着417房卡。')}
function r307(){st.clues++;st.sanity-=7;write('<div class=p>307没有锁。</div><div class=p>床头柜上有一部和你手里一模一样的手机。</div><div class=warn>屏幕亮起：<b>欢迎回来。</b></div>');log('<b>异常：</b>你的房间里出现第二部手机。')}
function mirror(){st.clues++;st.sanity-=8;st.pressure+=10;write('<div class=p>镜子里的你慢了一拍。</div><div class=p>你抬手，它过了一秒才抬手。</div><div class=warn>然后它把手指放在嘴唇前。</div><div class=p>嘘。</div>');log('<b>异常：</b>镜像出现延迟。')}
function r417(){st.clues++;if(!st.flags.has('rule')){st.flags.add('rule');write('<div class=warn>门上的刮痕组成一句话：</div><div class=pink><b>“凌晨三点以后，请勿打开没有门牌号的房间。”</b></div>');log('<b>规则：</b>凌晨三点以后，请勿打开没有门牌号的房间。')}else write('<div class=p>417门后有人低声说：</div><div class=warn>“不要让兔子进来。”</div>');}
function fire(){st.pressure+=8;write('<div class=p>消防门没有锁。</div><div class=warn>门后不是楼梯，而是一段向下延伸的走廊。</div>')}
function cctv(){st.clues++;st.pressure+=12;write('<div class=p>六块监控屏同时播放酒店大厅。</div><div class=p>时间分别是22:10 / 23:40 / 01:12 / 03:17 / 05:00。</div><div class=warn>最后一块屏幕里，你已经不在大厅。</div>');log('<b>监控：</b>系统里存在尚未发生的05:00画面。')}
function locker(){st.clues++;write('<div class=p>储物箱上写着你的名字。</div><div class=warn>里面只有一张照片：<b>“第4次，不要再相信乔。”</b></div>');log('<b>照片：</b>“第4次，不要再相信乔。”')}
function door(){if(st.time<180){write('<div class=p>门缝下有光，但你还没到规则要求的危险时间。</div><div class=p>你暂时决定记住它。</div>');return}choice('无编号的房间','你已经过了凌晨三点。门上没有门牌号。',[['直接打开',bad],['问绒团团',rabdoor],['离开',()=>write('<div class=good>你退开了。</div><div class=pink>绒团团：“这次算你聪明。”</div>')]])}
function bad(){st.pressure+=25;st.sanity-=20;st.clues+=2;write('<div class=warn>门开了。</div><div class=p>房间里什么都没有，只有四个名字。</div><div class=warn>三个被划掉了。最后一个是你的。</div><div class=pink>绒团团从门外探头：“哎呀。”</div>');log('<b>关键选择：</b>你打开了无编号房门。');}
function rabdoor(){st.points-=250;st.rabbit='偷偷开心';choice('绒团团的条件','它眨眨眼。',[['给它250积分',()=>{st.pressure=Math.max(0,st.pressure-18);write('<div class=pink>绒团团：“成交。”</div><div class=good>它把门牌轻轻贴回去：418。</div><div class=p>“今晚不要进啦。”</div>')}],['不给',()=>write('<div class=pink>绒团团：“那你自己进去嘛。”</div>')]])}
function choice(t,txt,cs){$('mt').textContent=t;$('mp').innerHTML=txt;$('mq').textContent='你的决定会改变今晚的后续。';$('mc').innerHTML=cs.map((c,i)=>`<button class=choice onclick="pick(${i})">${c[0]}</button>`).join('');window.cs=cs;$('modal').classList.remove('hide')};function pick(i){$('modal').classList.add('hide');window.cs[i][1]();render()}
function start(){$('modal').classList.add('hide');log('<b>副本开始：</b>23:40，你进入午夜酒店。');write('<div class=p>你收到一封没有寄件人的邮件：</div><div class=pink>“如果你还能看到这封邮件，请在今晚23:40前入住午夜酒店。”</div><div class=p>邮件里附着你的姓名、身份证号码，以及一张酒店房卡照片。</div><div class=p>照片上的房号：<b>307</b>。</div><div class=warn>你确定自己从来没来过这里。</div><div class=good>现在你可以自由探索。先弄清楚这里发生了什么。</div>');render()}
$('mt').textContent='你为什么会来到这里？';$('mp').innerHTML='你收到一封没有寄件人的邮件。现在正好是23:40。<br><br><b>“如果你还能看到这封邮件，请在今晚23:40前入住午夜酒店。”</b>';$('mq').innerHTML='酒店似乎记得你。';$('mc').innerHTML='<button class=choice onclick="start()">进入酒店</button>';render();
</script></body></html>
